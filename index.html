<script>
// ========== DANH SÁCH MÓN ĂN CHO TỪNG BỮA ==========
const DS_SANG = {

        { ten: "Giăm bông chiên", cachnau: "<strong>📋 Nguyên liệu:</strong> Giăm bông 100g, dầu ăn.\n\n<strong>👨‍🍳 Cách nấu:</strong>\n- Cắt giăm bông thành từng miếng nhỏ\n- Cho dầu nóng vào chảo\n- Chiên giăm bông đến khi vàng vọt, cạnh (2-3 phút)" },

        { ten: "Canh đậu hũ nấm", cachnau: "<strong>📋 Nguyên liệu:</strong> Đậu hũ non 2-3 miếng, các loại nấm 150g (nấm rơm, nấm đông cô...), hành lá, muối, nước mắm.\n\n<strong>👨‍🍳 Cách nấu:</strong>\n- Nước sôi cho nấm vào nấu 2 phút\n- Cho đậu hũ cắt khúc vào\n- Nêm muối, nước mắm vừa ăn\n- Thêm hành lá trước khi tắt lửa" },
        { ten: "Canh củ sen sườn non", cachnau: "<strong>📋 Nguyên liệu:</strong> Sườn non 300g, củ sen 200g, hành khô, muối, hạt nêm, tiêu.\n\n<strong>👨‍🍳 Cách nấu:</strong>\n- Sườn chần sơ, rửa sạch\n- Nước sôi cho sườn vào nấu 20 phút\n- Cho củ sen cắt khúc vào\n- Nêm muối, hạt nêm, tiêu vừa ăn" }
    ],
    rau: [
        { ten: "Bầu xào tôm khô", cachnau: "<strong>📋 Nguyên liệu:</strong> Bầu 1 quả nhỏ, tôm khô 30g, hành khô, nước mắm, muối, dầu ăn.\n\n<strong>👨‍🍳 Cách nấu:</strong>\n- Cắt bầu thành hạt nhỏ\n- Tôm khô rửa sạch, ngâm nước ấm mềm\n- Cho dầu nóng, phi hành khô\n- Thêm bầu, tôm khô, nêm nước mắm, muối (5-6 phút)" },
        { ten: "Cải xanh xào nấm", cachnau: "<strong>📋 Nguyên liệu:</strong> Cải xanh 1 bó, nấm các loại 150g, tỏi 2 tép, xì dầu, dầu hào, dầu ăn.\n\n<strong>👨‍🍳 Cách nấu:</strong>\n- Chần cải xanh nước sôi 1 phút, vớt ra\n- Cho dầu nóng, phi tỏi\n- Cho nấm vào xào, rồi thêm cải\n- Nêm xì dầu, dầu hào (3-4 phút)" },
        { ten: "Su hào xào cà rốt", cachnau: "<strong>📋 Nguyên liệu:</strong> Su hào 1 củ nhỏ, cà rốt 1 củ, hành khô, muối, nước mắm, tiêu, dầu ăn.\n\n<strong>👨‍🍳 Cách nấu:</strong>\n- Cắt su hào, cà rốt thành que nhỏ\n- Cho dầu nóng, phi hành khô\n- Cho su hào, cà rốt vào đảo\n- Nêm muối, nước mắm, tiêu (5-6 phút)" }
    ]
};

// ========== CHỌN NGẪU NHIÊN ==========
function layNgauNhien(arr, soLuong) {
    const kq = [];
    const mangTam = [...arr];
    for (let i = 0; i < soLuong && mangTam.length > 0; i++) {
        const vt = Math.floor(Math.random() * mangTam.length);
        kq.push(mangTam.splice(vt, 1)[0]);
    }
    return kq;
}

// ========== CHỌN MÓN ĂN ==========
function chonMonAn() {
    const loaiBua = document.getElementById('loaiBua').value;
    if (!loaiBua) {
        alert('Vui lòng chọn loại bữa ăn!');
        return;
    }
    
    const soMon = parseInt(document.getElementById('soMon').value);
    const dsMon = [];
    
    // Chọn danh sách dựa trên bữa ăn
    const dsHienTai = loaiBua === 'sang' ? DS_SANG : loaiBua === 'trua' ? DS_TRUA : DS_TOI;
    
    const coCanh = soMon >= 2;
    
    if (coCanh) {
        const [canh] = layNgauNhien(dsHienTai.canh, 1);
        dsMon.push({ ...canh, loai: 'canh' });
    }
    
    const soMonConLai = soMon - dsMon.length;
    const soThit = Math.ceil(soMonConLai / 2);
    const soRau = soMonConLai - soThit;
    
    layNgauNhien(dsHienTai.thit, soThit).forEach(m => dsMon.push({ ...m, loai: 'thit' }));
    layNgauNhien(dsHienTai.rau, soRau).forEach(m => dsMon.push({ ...m, loai: 'rau' }));
    
    hienThi(dsMon, loaiBua);
    document.getElementById('actionButtons').style.display = 'flex';
}

// ========== HIỂN THỊ KẾT QUẢ ==========
function hienThi(dsMon, loaiBua) {
    const box = document.getElementById('ketQua');
    box.innerHTML = '';
    
    const tenBua = loaiBua === 'sang' ? '🌅 Bữa sáng' : loaiBua === 'trua' ? '☀️ Bữa trưa' : '🌙 Bữa tối';
    
    let html = `<div class="buaf-chi-thi">${tenBua}</div>`;

    dsMon.forEach((mon, stt) => {
        const icon = mon.loai === 'canh' ? '🍲' : mon.loai === 'thit' ? '🥩' : '🥬';
        const lop = mon.loai === 'canh' ? 'dish-canh' : mon.loai === 'thit' ? 'dish-thit' : 'dish-rau';
        const tenLoai = mon.loai === 'canh' ? 'Món canh' : mon.loai === 'thit' ? 'Món thịt/hải sản' : 'Rau xào';

        html += `
        <div class="dish-item ${lop}" id="mon-${stt}" onclick="moRongCachNau(${stt})">
            <span class="dish-icon">${icon}</span>
            <span class="dish-name">${mon.ten}</span>
            <div class="dish-note">${tenLoai} — Bấm xem cách nấu ▼</div>
            <div class="cach-nau-box" id="cachnau-${stt}">${mon.cachnau}</div>
        </div>`;
    });
    
    box.innerHTML = html;
    box.classList.add('hien-thi');
}

// ========== MỞ RỘNG / THU HƯỚNG DẪN NẤU ==========
function moRongCachNau(stt) {
    const khung = document.getElementById(`cachnau-${stt}`);
    khung.classList.toggle('mo-rong');
}

// ========== SHARE LÀ HÌNH ẢNH ==========
function shareAsImage() {
    const ketQua = document.getElementById('ketQua');
    const container = document.getElementById('screenshotContainer');
    
    // Clone phần kết quả vào hidden container
    const clone = ketQua.cloneNode(true);
    container.innerHTML = '';
    container.appendChild(clone);
    
    // Lấy screenshot
    html2canvas(clone, {
        backgroundColor: '#fffef8',
        scale: 2,
        allowTaint: true,
        useCORS: true
    }).then(canvas => {
        canvas.toBlob(blob => {
            // Tạo file từ blob
            const file = new File([blob], 'menu.png', { type: 'image/png' });
            
            // Kiểm tra hỗ trợ Web Share API
            if (navigator.share) {
                navigator.share({
                    title: 'Menu hôm nay',
                    text: 'Xem gợi ý menu của tôi!',
                    files: [file]
                }).catch(err => {
                    if (err.name !== 'AbortError') {
                        console.log('Lỗi:', err);
                    }
                });
            } else {
                // Fallback: download hình ảnh
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'menu.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alert('Hình ảnh đã được tải về!');
            }
        });
    }).catch(err => {
        console.error('Lỗi khi tạo hình ảnh:', err);
        alert('Không thể tạo hình ảnh. Vui lòng thử lại!');
    });
}
