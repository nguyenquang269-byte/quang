<script>
// ========== DANH SÁCH MÓN ĂN + HƯỚNG DẪN CHI TIẾT ==========
const DS_THIT = [
    { ten: "Thịt kho tàu", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt ba chỉ 500g, nước mắm ngon, đường nâu, nước dừa tươi 1 quả, trứng gà/vịt 3-4 quả, gừng, hành khô, tiêu, ớt.\n\n<strong>🔪 Sơ chế:</strong>\n- Thịt rửa sạch với nước muối loãng, thái khúc vuông khoảng 4-5cm.\n- Ướp thịt với 3 muỗng canh nước mắm, 2 muỗng canh đường, gừng thái chỉ, hành băm, tiêu trong 30 phút.\n- Trứng luộc chín, bóc vỏ.\n\n<strong>🔥 Cách nấu:</strong>\n1. Cho 3 muỗng canh đường vào nồi, bật lửa nhỏ, khuấy đều cho đường tan và chuyển màu nâu cánh gián.\n2. Đổ thịt đã ướp vào, đảo nhanh tay cho thịt săn lại và ngấm màu.\n3. Đổ nước dừa tươi vào ngập mặt thịt, đun sôi rồi hạ lửa nhỏ, hớt bọt bẩn.\n4. Khi nước cạn khoảng nửa, cho trứng vào kho cùng, nêm nếm lại cho vừa ăn ngọt mặn.\n5. Kho đến khi nước sánh lại, chuyển màu nâu óng ánh thì tắt bếp. Rắc tiêu và ớt lên trên." },
    { ten: "Thịt luộc mắm nêm", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt ba chỉ 400g, gừng 1 củ, hành khô 2 củ, mắm nêm 3 muỗng canh, đường, chanh, nước lọc, tỏi, ớt, thơm (dứa).\n\n<strong>🔪 Sơ chế:</strong>\n- Thịt rửa sạch với nước muối loãng, để ráo.\n- Gừng thái lát, hành khô bóc vỏ đập dập.\n\n<strong>🔥 Cách nấu:</strong>\n1. Nấu nước sôi, cho gừng và hành khô vào, thả thịt vào luộc lửa vừa.\n2. Luộc khoảng 15-20 phút tùy độ dày, thịt chín tới thì vớt ra ngay.\n3. Ngâm thịt vào nước lạnh khoảng 5 phút cho trắng và giòn, sau đó thái lát mỏng.\n4. Pha mắm nêm: cho 3 muỗng mắm nêm + 2 muỗng đường + 2 muỗng nước cốt chanh + 3 muỗng nước lọc + tỏi ớt băm + thơm băm nhỏ. Khuấy đều nếm vừa ăn ngọt chua mặn." },
    { ten: "Thịt nướng sả ớt", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt nạc dăm hoặc nạc vai 500g, sả 3-4 củ, ớt trái 2-3 quả, hành khô, tỏi, nước mắm, đường, dầu ăn, mật ong (nếu có), tiêu.\n\n<strong>🔪 Sơ chế & ướp:</strong>\n- Thịt rửa sạch, thái lát mỏng ngang thớ dày khoảng 0.5cm.\n- Sả, hành, tỏi, ớt băm nhuyễn.\n- Ướp thịt với hỗn hợp băm + 2 muỗng canh nước mắm + 1 muỗng canh đường + 1 muỗng canh dầu ăn + ít tiêu. Trộn đều, để 60 phút cho thấm.\n\n<strong>🔥 Cách nướng:</strong>\n1. Nếu nướng than: trải thịt trên vỉ, nướng lửa vừa, quết chút nước ướp cho ẩm, trở đều hai mặt đến khi vàng thơm.\n2. Nếu dùng chảo: cho ít dầu ăn, áp chảo thịt chín vàng đều hai mặt lửa vừa." },
    { ten: "Thịt rang cháy cạnh", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt ba chỉ 400g, hành khô 3 củ, nước mắm ngon, đường, tiêu.\n\n<strong>🔪 Sơ chế:</strong>\n- Thịt rửa sạch, thái miếng hình chữ nhật dày khoảng 0.7cm.\n- Luộc sơ thịt trong nước sôi 2 phút, vớt ra rửa sạch, để ráo nước hoàn toàn.\n\n<strong>🔥 Cách làm:</strong>\n1. Cho thịt vào chảo nóng không dầu, rang lửa vừa. Thịt tự ra mỡ, đảo đều cho thịt vàng các cạnh.\n2. Khi thịt vàng cạnh đẹp mắt, cho hành khô băm vào phi thơm.\n3. Nêm 2 muỗng canh nước mắm + 1 muỗng canh đường. Đảo nhanh lửa lớn cho gia vị kết dính quanh thịt, có vị ngọt mặn thơm lừng.\n4. Tắt bếp, rắc tiêu xay." },
    { ten: "Bò lúc lắc", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt bò phi lê/nạc vai 400g, hành tây 1 củ, ớt chuông đỏ/xanh mỗi thứ nửa quả, tương ớt, xì dầu, dầu hào, đường, tiêu, tỏi băm, bột năng.\n\n<strong>🔪 Sơ chế & ướp:</strong>\n- Thịt bò thái khúc vuông 2-3cm theo thớ ngang.\n- Ướp: 1 muỗng xì dầu + 1 muỗng dầu hào + ít tiêu + 1 muỗng dầu ăn + nửa muỗng bột năng. Để 20 phút.\n\n<strong>🔥 Cách xào:</strong>\n1. Pha sốt: 1 muỗng xì dầu + 1 muỗng dầu hào + 1 muỗng tương ớt + nửa muỗng đường + ít nước.\n2. Phi thơm tỏi, xào thịt bò lửa lớn nhanh tay đến khi chín tái thì đổ ra đĩa.\n3. Dùng chảo đó, xào hành tây + ớt chuông chín tới, đổ chén sốt vào đun sôi nhẹ.\n4. Cho thịt bò trở lại chảo, đảo nhanh 30 giây rồi tắt bếp ngay." },
    { ten: "Gà kho gừng", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt gà 500g, gừng tươi 1 củ to, nước mắm, đường, hạt tiêu, hành khô, ớt tươi, nước lọc/nước dừa.\n\n<strong>🔪 Sơ chế & ướp:</strong>\n- Gà rửa sạch với nước muối gừng, chặt khúc vừa ăn.\n- Ướp: 2 muỗng nước mắm + 1 muỗng đường + nửa củ gừng băm + hành khô băm + ít tiêu. Để 30 phút.\n\n<strong>🔥 Cách kho:</strong>\n1. Gừng còn lại thái lát mỏng hoặc chỉ, cho vào nồi cùng chút dầu phi thơm.\n2. Đổ gà vào đảo nhanh cho săn thịt.\n3. Thêm nước vừa ngập mặt thịt, đun sôi rồi hạ lửa nhỏ kho riu riu.\n4. Khi nước cạn còn khoảng 1/3, nêm nếm lại cho vừa ăn ngọt mặn.\n5. Kho đến khi nước sánh lại, thịt vàng ươm, gừng thơm lừng là được." },
    { ten: "Sườn nướng mật ong", cachnau: "<strong>📋 Nguyên liệu:</strong> Sườn non 500g, mật ong 2 muỗng canh, nước mắm 2 muỗng, xì dầu 1 muỗng, tỏi băm, hành băm, tiêu, dầu ăn, tương ớt ít.\n\n<strong>🔪 Sơ chế & ướp:</strong>\n- Sườn chặt khúc 5-6cm, rửa sạch, luộc sơ với gừng hành cho hết bẩn, để ráo.\n- Ướp: mật ong + nước mắm + xì dầu + tỏi hành băm + tiêu + 1 muỗng dầu ăn. Để 60 phút hoặc để tủa tối.\n\n<strong>🔥 Cách nướng:</strong>\n1. Làm nóng lò ở 180°C. Lót giấy bạc vào khay, xếp sườn.\n2. Nướng khoảng 15 phút, lấy ra quết nước ướp, trở mặt.\n3. Nướng tiếp 10-15 phút cho cả hai mặt vàng đỏ đẹp, thơm ngọt ngào là xong." },
    { ten: "Tôm rim nước dừa", cachnau: "<strong>📋 Nguyên liệu:</strong> Tôm tươi 500g, nước dừa tươi nửa bát, nước mắm, đường, hành khô, tỏi, tiêu.\n\n<strong>🔪 Sơ chế:</strong>\n- Tôm rửa sạch, bỏ râu, bỏ chân, có thể bóc vỏ hoặc để nguyên.\n\n<strong>🔥 Cách rim:</strong>\n1. Phi thơm hành tỏi băm với chút dầu nóng.\n2. Cho tôm vào đảo nhanh cho chuyển màu đỏ.\n3. Thêm nước mắm + đường theo tỷ lệ 1:1 khoảng 2 muỗng mỗi thứ, đổ nước dừa vào xâm xấp.\n4. Rim lửa vừa đến khi nước cạn sánh, quyện quanh tôm màu vàng đỏ óng ánh, vị ngọt thanh là được." },
    { ten: "Cá kho tộ", cachnau: "<strong>📋 Nguyên liệu:</strong> Cá lóc/basa 500g, nước mắm, đường nâu, nước dừa, gừng, hành khô, ớt, tiêu.\n\n<strong>🔪 Sơ chế:</strong>\n- Cá rửa sạch với nước muối gừng, cắt khúc dày 3cm.\n- Chiên sơ cá vàng hai mặt cho chắc thịt.\n\n<strong>🔥 Cách kho:</strong>\n1. Cho gừng thái chỉ, hành băm vào tộ đất phi thơm.\n2. Xếp cá vào, thêm nước mắm, đường, nước dừa xâm xấp mặt cá.\n3. Đun sôi rồi hạ lửa nhỏ, không đậy nắp kín. Kho riu riu lâu cho cá thấm vị.\n4. Nêm nếm lại cho vừa ăn, kho đến khi nước sánh lại, màu nâu đen đẹp mắt là được." },
    { ten: "Thịt bò kho quế", cachnau: "<strong>📋 Nguyên liệu:</strong> Thịt bò 500g, quế khô 1 nhánh nhỏ, gừng, hành, tỏi, nước mắm, đường, nước dừa, hạt tiêu.\n\n<strong>🔪 Sơ chế & ướp:</strong>\n- Thịt bò thái khúc vuông 4cm, luộc sơ nước sôi 2 phút, rửa sạch.\n- Ướp với gừng tỏi băm, nước mắm, đường, tiêu, quế băm nhỏ 30 phút.\n\n<strong>🔥 Cách kho:</strong>\n1. Cho chút dầu vào nồi, đổ thịt vào đảo săn.\n2. Thêm nước dừa hoặc nước nóng ngập thịt, bỏ nhánh quế vào.\n3. Đun sôi rồi hạ lửa rất nhỏ, kho đến khi thịt mềm, nước cạn sánh lại, thơm lừng vị quế." }
];

const DS_CANH = [
    { ten: "Canh chua cá lóc", cachnau: "<strong>📋 Nguyên liệu:</strong> Cá lóc 500g, me chua 50g, đậu bắp 3-4 quả, thơm (dứa) nửa quả, cà chua 2 quả, giá đỗ 1 nắm, ngò ôm, hành lá, nước mắm, đường, muối, tỏi băm.\n\n<strong>🔪 Sơ chế:</strong>\n- Cá rửa sạch với nước muối gừng, cắt khúc dày 3cm. Có thể chiên sơ qua.\n- Me ngâm nước nóng, dầm lấy nước chua, bỏ hạt.\n- Đậu bắp thái xéo, thơm thái miếng, cà chua bổ múi, giá rửa sạch, ngò hành cắt khúc.\n\n<strong>🔥 Cách nấu:</strong>\n1. Nấu khoảng 1.5 lít nước sôi, cho phần cọng ngò ôm + hành lá vào nấu cho thơm rồi vớt ra.\n2. Đổ nước me vào, thêm nước mắm, đường, muối vừa ăn tạo vị chua ngọt hài hòa.\n3. Thả cá vào nấu lửa vừa đến khi cá chín nổi lên trên.\n4. Thêm đậu bắp, thơm, cà chua nấu sôi lại nhẹ.\n5. Cuối cùng cho giá đỗ + ngò ôm + hành lá thái khúc vào, đun sôi lăn tăn rồi tắt bếp ngay." },
    { ten: "Canh khổ qua nhồi thịt", cachnau: "<strong>📋 Nguyên liệu:</strong> Khổ qua 2 quả, thịt nạc băm 200g, nấm mèo 3-4 tai, hành khô, tiêu, nước mắm, hành lá, hạt nêm.\n\n<strong>🔪 Sơ chế & nhồi:</strong>\n- Khổ qua rửa sạch, cắt bỏ hai đầu, dùng đũa luồn bỏ ruột. Có thể ngâm nước muối loãng 15 phút giảm bớt vị đắng.\n- Nấm mèo ngâm nở, băm nhỏ trộn cùng thịt băm, hành khô băm, 1 muỗng nước mắm, ít tiêu, hạt nêm. Trộn đều để 15 phút.\n- Nhồi hỗn hợp thịt vào trong khổ qua thật chặt.\n\n<strong>🔥 Cách nấu:</strong>\n1. Nấu khoảng 1.2 lít nước sôi, nhẹ nhàng thả khổ qua vào.\n2. Đun sôi rồi hạ lửa nhỏ, không đậy nắp kín để giảm đắng.\n3. Nấu khoảng 25-35 phút tùy kích thước, kiểm tra khổ qua mềm trong là được.\n4. Nêm nước mắm, hạt nêm vừa ăn, rắc hành lá thái khúc và tiêu xay trước khi tắt bếp." },

// ========== CHỌN NGẪU NHIÊN ==========
function layNgauNhien(arr, soLuong) {
    const kq = [];
    const mangTam = [...arr];
    for (let i = 0; i < soLuong && mangTam.length > 0; i++) {
        const vt = Math.floor(Math.random() * mangTam.length);
        kq.push(mangTam.splice(vt, 1)[0]);
    }
    return kq;
}

// ========== CHỌN MÓN ĂN ==========
function chonMonAn() {
    const soMon = parseInt(document.getElementById('soMon').value);
    const dsMon = [];
    const coCanh = soMon >= 2;

    if (coCanh) {
        const [canh] = layNgauNhien(DS_CANH, 1);
        dsMon.push({ ...canh, loai: 'canh' });
    }

    const soMonConLai = soMon - dsMon.length;
    const soThit = Math.ceil(soMonConLai / 2);
    const soRau = soMonConLai - soThit;

    layNgauNhien(DS_THIT, soThit).forEach(m => dsMon.push({ ...m, loai: 'thit' }));
    layNgauNhien(DS_RAU, soRau).forEach(m => dsMon.push({ ...m, loai: 'rau' }));

    hienThi(dsMon);
}

// ========== HIỂN THỊ KẾT QUẢ ==========
function hienThi(dsMon) {
    const box = document.getElementById('ketQua');
    box.innerHTML = '';

    dsMon.forEach((mon, stt) => {
        const icon = mon.loai === 'canh' ? '🍲' : mon.loai === 'thit' ? '🥩' : '🥬';
        const lop = mon.loai === 'canh' ? 'dish-canh' : mon.loai === 'thit' ? 'dish-thit' : 'dish-rau';
        const tenLoai = mon.loai === 'canh' ? 'Món canh' : mon.loai === 'thit' ? 'Món thịt/hải sản' : 'Rau xào';

        const html = `
        <div class="dish-item ${lop}" id="mon-${stt}" onclick="moRongCachNau(${stt})">
            <span class="dish-icon">${icon}</span>
            <span class="dish-name">${mon.ten}</span>
            <div class="dish-note">${tenLoai} — Bấm xem cách nấu ▼</div>
            <div class="cach-nau-box" id="cachnau-${stt}">${mon.cachnau}</div>
        </div>`;
        box.innerHTML += html;
    });

    box.classList.add('hien-thi');
}

// ========== MỞ RỘNG / THU HƯỚNG DẪN NẤU ==========
function moRongCachNau(stt) {
    const khung = document.getElementById(`cachnau-${stt}`);
    khung.classList.toggle('mo-rong');
}
</script>
</body>
</html>
